name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv venv && uv pip install -e . pytest
      - run: .venv/bin/pytest -q   # real-Decider test skips; Bedrock is never called in tests
